# Example config for verifying ``code_change`` deliverables with
# ``signoff-code`` under ``DockerRuntime``.
#
# Start here when dogfooding the pack against a real codebase — copy
# the file, adjust the runtime_policy image tag for your environment,
# and point your MCP client (Claude Code, Cursor, …) at the harness.
#
# Prerequisites:
#   pip install signoff-code signoff-runtime-docker signoff-judge signoff-http
#   docker build -t signoff/code-sandbox:dev packages/signoff-code
#   export SIGNOFF_JUDGE_API_KEY=...  # optional: enables semantic_diff
#
# The pack's own ``default_config.yaml`` (installed via the
# ``signoff.pack_defaults`` entry point) already enables the five
# verifiers and declares the budget; this file layers runtime choices
# + the docker image on top.

protocol_version: "0.1"

runtime:
  default: docker
  per_verifier:
    signoff-code.smoke_imports: docker
    signoff-code.tests_pass: docker
    signoff-code.types_check: docker
    signoff-code.lint_clean: docker
    signoff-code.semantic_diff: docker

runtime_policy:
  docker:
    timeout_seconds: 300
    cpu_limit: 2.0
    memory_limit_mb: 2048
    network: none
    # Operators running against the published image should point at
    # ``ghcr.io/signoff/code-sandbox:latest`` here; the dev image
    # built locally from packages/signoff-code/Dockerfile is the
    # recommended starting point until you have cosign configured.
    image: signoff/code-sandbox:dev

http:
  provider: httpx

judge:
  # Anthropic is the default. Switch to ``openai`` (with OPENAI_API_KEY
  # or SIGNOFF_JUDGE_API_KEY) or ``fake`` for offline runs.
  provider: anthropic
  model: claude-haiku-4-5
