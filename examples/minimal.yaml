# Minimal Signoff harness config. Referenced by docker-compose.yml and
# the "Try it" quickstart in the repo README.
#
# An empty config is the legitimate Phase 0 configuration: no verifier
# packs installed, so every request_signoff call returns a trivially-
# passing Verdict. This lets you exercise the MCP plumbing end-to-end
# before any verifier packs land. See docs/configuration.md for the
# full schema and docs/mcp-integration.md for MCP client wiring.

protocol_version: "0.1"

# No packs installed — verdicts will always pass, with results=[].
packs: []

# Kinds you'll accept in request_signoff calls. Adding a block here with
# verifiers: {} makes the harness aware of the kind without running
# anything against it. Empty blocks are fine.
deliverables: {}

budget:
  max_cost_usd: 0.50
  max_duration_seconds: 120
  global_concurrency: 16
  early_termination: false

runtime:
  default: local
  # Sandboxing for Phase 1 packs that execute untrusted code (e.g.
  # signoff-code) belongs to DockerRuntime. Install
  # signoff-runtime-docker and uncomment the per-verifier map once
  # you have real code-executing verifiers:
  #
  # per_verifier:
  #   signoff-code.tests: docker
  #   signoff-code.types: docker
  #
  # See docs/runtimes.md § "DockerRuntime" for the security posture
  # and docs/deployment.md § "Running with DockerRuntime" for how to
  # expose the Docker socket to a containerised harness.

# Phase 0 smoke config uses the in-memory FakeHttpClient so the minimal
# stack has no outbound dependencies. Switch to `provider: httpx` once
# you have real verifiers that need to fetch URLs; tuning
# (timeouts / retries / robots) flows through SIGNOFF_HTTP_* env vars,
# see docs/http-client.md.
http:
  provider: fake

# Judge provider. "fake" keeps the smoke stack hermetic; switch to
# "anthropic" or "openai" once you have an API key and a verifier that
# uses ctx.judge. Real credentials flow through SIGNOFF_JUDGE_* env
# vars (see docs/judge-client.md), not this YAML.
judge:
  provider: fake
  model: claude-haiku-4-5
  max_tokens: 1024

retries:
  default_budget: 3
