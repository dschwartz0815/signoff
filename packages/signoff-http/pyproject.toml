[project]
name = "signoff-http"
version = "0.0.1"
description = "Real httpx-backed HTTP client for Signoff verifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
dependencies = [
    "signoff-core",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.urls]
Homepage = "https://github.com/signoff/signoff"
Repository = "https://github.com/signoff/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff_http"]
