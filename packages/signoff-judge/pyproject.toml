[project]
name = "signoff-judge"
version = "0.0.1"
description = "Real LLM-judge client (Anthropic, OpenAI) for Signoff verifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
dependencies = [
    "signoff-core",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/signoff/signoff"
Repository = "https://github.com/signoff/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff_judge"]
# NOTE: do NOT add a ``[tool.hatch.build.targets.wheel.force-include]``
# block to re-add anything under ``src/signoff_judge`` — the
# ``packages`` directive above already includes the entire tree
# (including the ``prompts/`` subdirectory and its bundled
# ``.md`` / ``.schema.json`` files). A redundant force-include
# duplicates every named entry in the wheel zip, which the build
# warns about but the loader silently ignores in favour of
# whichever copy comes first. Test by:
#   $ cd packages/signoff-judge && rm -rf dist && uv build
# and confirming no "Duplicate name:" warnings appear.
