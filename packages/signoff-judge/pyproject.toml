[project]
name = "signoff-judge"
version = "0.0.1"
description = "Real LLM-judge client (Anthropic, OpenAI) for Signoff verifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
dependencies = [
    "signoff-core",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/signoff/signoff"
Repository = "https://github.com/signoff/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff_judge"]

[tool.hatch.build.targets.wheel.force-include]
"src/signoff_judge/prompts" = "signoff_judge/prompts"
