[project]
name = "signoff-mcp"
version = "0.0.1"
description = "MCP server adapter for Signoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
dependencies = [
    "signoff-core",
    "mcp>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
signoff-mcp = "signoff_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/dschwartz0815/signoff"
Repository = "https://github.com/dschwartz0815/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff_mcp"]
