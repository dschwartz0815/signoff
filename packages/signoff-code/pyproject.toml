[project]
name = "signoff-code"
version = "0.0.1"
description = "Coding verifiers pack for Signoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
dependencies = [
    "signoff-core",
    "typing-extensions>=4.12",
    "pyyaml>=6.0",
]

[project.entry-points."signoff.verifiers"]
lint_clean = "signoff_code.verifiers.lint_clean:lint_clean"
semantic_diff = "signoff_code.verifiers.semantic_diff:semantic_diff"
smoke_imports = "signoff_code.verifiers.smoke_imports:smoke_imports"
tests_pass = "signoff_code.verifiers.tests_pass:tests_pass"
types_check = "signoff_code.verifiers.types_check:types_check"

[project.entry-points."signoff.pack_defaults"]
signoff-code = "signoff_code.defaults:load"

[project.entry-points."signoff.deliverable_preparers"]
code_change = "signoff_code.prepare:prepare_code_change"

[project.urls]
Homepage = "https://github.com/dschwartz0815/signoff"
Repository = "https://github.com/dschwartz0815/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff_code"]
# NOTE: ``packages`` already includes everything under
# ``src/signoff_code`` — including ``default_config.yaml`` and
# the prompts/ tree. Don't add a
# ``[tool.hatch.build.targets.wheel.force-include]`` block here:
# at best it's redundant, at worst it duplicates every file in
# the wheel zip (see signoff-judge's prior version of this same
# pattern, which produced ``UserWarning: Duplicate name:`` on
# every prompt file). Verify with:
#   $ rm -rf dist && uv build --package signoff-code
#   $ unzip -l dist/signoff_code-*.whl | grep default_config
# default_config.yaml should appear exactly once.
