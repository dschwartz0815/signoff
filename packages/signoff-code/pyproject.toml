[project]
name = "signoff-code"
version = "0.0.1"
description = "Coding verifiers pack for Signoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
dependencies = [
    "signoff-core",
]

[project.entry-points."signoff.verifiers"]
# Verifiers are registered here in Phase 1.

[project.urls]
Homepage = "https://github.com/signoff/signoff"
Repository = "https://github.com/signoff/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff_code"]
