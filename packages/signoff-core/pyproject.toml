[project]
name = "signoff-core"
version = "0.0.1"
description = "Core engine for Signoff — the verification layer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signoff Authors" }]
keywords = ["agents", "verification", "llm", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "anyio>=4.3",
]

[project.urls]
Homepage = "https://github.com/dschwartz0815/signoff"
Documentation = "https://github.com/dschwartz0815/signoff/tree/main/docs"
Repository = "https://github.com/dschwartz0815/signoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoff"]
