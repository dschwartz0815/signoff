[project]
name = "signoff-workspace"
version = "0.0.0"
description = "Monorepo root for Signoff (not published)."
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/signoff-core",
    "packages/signoff-mcp",
    "packages/signoff-code",
    "packages/signoff-http",
]

[tool.uv.sources]
signoff-core = { workspace = true }
signoff-mcp = { workspace = true }
signoff-code = { workspace = true }
signoff-http = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "signoff-core",
    "signoff-mcp",
    "signoff-code",
    "signoff-http",
    "starlette>=0.37",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dist", "build", "node_modules", "cloud/dashboard"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
files = ["packages"]
exclude = ['packages/[^/]+/tests/']

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
# The MCP Server decorators aren't typed; turn off the noisy
# untyped-decorator warnings at the boundary.
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["uvicorn.*", "starlette.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["packages", "tests/parity"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast unit tests (default)",
    "integration: multi-component tests, may use Docker",
    "regression: pack regression suites with ground-truth labels",
    "parity: cross-language protocol parity tests",
]
